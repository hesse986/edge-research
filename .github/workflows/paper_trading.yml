name: Pairs Trading Monitor

on:
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'  # co 4H UTC
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache Binance data
      uses: actions/cache@v4
      with:
        path: cache/
        key: binance-cache-${{ github.run_id }}
        restore-keys: |
          binance-cache-

    - name: Install dependencies
      run: pip install ccxt pandas numpy scikit-learn requests

    - name: Run monitor
      run: python3 paper_trading_pairs_advanced_with_R.py --once
      env:
        PYTHONUNBUFFERED: "1"

    - name: Commit results
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add paper_trades_pairs_advanced_R.csv
        git diff --staged --quiet || git commit -m "data: paper trading $(date -u '+%Y-%m-%d %H:%M UTC')"
        git push
# workflow test
